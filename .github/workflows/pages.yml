name: Website (GitHub Pages)

# Publishes the website: the web version (with car data collected from Bilbasen
# by scraper/scrape.mjs) and the Android download page with the newest APK.
# Runs on every push to the default branch (reusing the published data) and twice a
# day, or from the Actions tab, to refresh the data.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 4,16 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Only the repository's default branch is published.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and APK
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Assemble site
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk site/brugtbil-browser.apk
          size=$(du -m site/brugtbil-browser.apk | cut -f1)
          sed -i "s/{{VERSION}}/0.2.${GITHUB_RUN_NUMBER}/g; s/{{SIZE}}/${size} MB/g; s/{{DATE}}/$(date -u +%Y-%m-%d)/g" site/android.html
      - id: pages
        uses: actions/configure-pages@v5
      - name: Start from the currently published car data
        # If today's scrape fails, the site keeps the previous data instead of going empty.
        run: |
          mkdir -p site/data
          curl -fsSL "${{ steps.pages.outputs.base_url }}/data/listings.json" -o site/data/listings.json \
            || echo "No published data yet"
      # A push (code/page change) reuses the published data so it goes live in ~2 min;
      # the schedule and manual runs refresh the data from Bilbasen.
      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: 22
      - name: Collect car data from Bilbasen
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 40
        working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run scrape
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
