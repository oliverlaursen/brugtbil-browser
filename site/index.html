<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brugtbil Browser</title>
<meta name="description" content="Brugte biler fra Bilbasen samlet som én række pr. model med prisspænd. Filtrér på mærke, model, årgang, km, pris, drivmiddel, gearkasse og rækkevidde.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%236750a4' d='M18.9 6c-.2-.6-.8-1-1.4-1h-11c-.7 0-1.2.4-1.4 1L3 12v8c0 .6.4 1 1 1h1c.6 0 1-.4 1-1v-1h12v1c0 .6.4 1 1 1h1c.6 0 1-.4 1-1v-8l-2.1-6zM6.5 16c-.8 0-1.5-.7-1.5-1.5S5.7 13 6.5 13s1.5.7 1.5 1.5S7.3 16 6.5 16zm11 0c-.8 0-1.5-.7-1.5-1.5s.7-1.5 1.5-1.5 1.5.7 1.5 1.5-.7 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z'/></svg>">
<style>
  :root {
    --bg: #fdf8fd; --surface: #f3edf7; --field: #fff; --text: #1c1b1f; --muted: #5d5a66;
    --accent: #6750a4; --accent-soft: #e8def8; --on-accent: #fff; --border: #cac4d0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141218; --surface: #211f26; --field: #1b1a1f; --text: #e6e0e9; --muted: #aaa3b4;
            --accent: #d0bcff; --accent-soft: #4a4458; --on-accent: #381e72; --border: #49454f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  header { max-width: 1180px; margin: 0 auto; padding: 20px 16px 8px; display: flex;
           align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.01em; }
  header small { color: var(--muted); }
  .layout { max-width: 1180px; margin: 0 auto; padding: 8px 16px 48px; display: grid;
            grid-template-columns: 300px 1fr; gap: 24px; align-items: start; }
  form { background: var(--surface); border-radius: 16px; padding: 16px; display: grid; gap: 12px;
         position: sticky; top: 12px; }
  label { display: grid; gap: 4px; font-size: .82rem; color: var(--muted); }
  input, select { font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--border);
                  border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  fieldset { border: 0; padding: 0; margin: 0; }
  legend { font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: inline-block; border: 1px solid var(--border); border-radius: 8px; padding: 5px 11px;
               font-size: .88rem; cursor: pointer; user-select: none; color: var(--text); }
  .chip input:checked + span { background: var(--accent-soft); border-color: transparent; font-weight: 600; }
  .chip input:focus-visible + span { outline: 2px solid var(--accent); }
  button { font: inherit; border: 1px solid var(--border); background: transparent; color: var(--accent);
           border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
  .summary { color: var(--muted); margin: 0 0 12px; min-height: 1.4em; }
  #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  .car { display: grid; grid-template-columns: 128px 1fr; gap: 14px; background: var(--surface);
         border-radius: 16px; padding: 12px; text-decoration: none; color: inherit; align-items: center; }
  .car:hover { outline: 2px solid var(--accent-soft); }
  .photo { width: 128px; height: 96px; border-radius: 10px; background: var(--accent-soft); object-fit: cover; display: block; }
  .car h2 { font-size: 1.02rem; margin: 0 0 2px; }
  .price { color: var(--accent); font-size: 1.15rem; font-weight: 650; margin: 0 0 4px; }
  .details { color: var(--muted); font-size: .84rem; margin: 0; }
  .empty { color: var(--muted); padding: 32px 0; }
  .more { margin: 16px auto 0; display: block; }
  [hidden] { display: none !important; }
  footer { max-width: 1180px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: .85rem; }
  #toggle { display: none; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; gap: 12px; }
    form { position: static; }
    form.collapsed > :not(#toggleRow) { display: none; }
    #toggle { display: inline-block; }
    #results { grid-template-columns: 1fr; }
    .car { grid-template-columns: 104px 1fr; }
    .photo { width: 104px; height: 78px; }
  }
</style>
</head>
<body>
<header>
  <h1>Brugtbil Browser</h1>
  <small>Bilbasens brugte biler, én række pr. model · <a href="android.html">Hent Android-appen</a></small>
</header>
<div class="layout">
  <form id="filters" autocomplete="off">
    <div id="toggleRow"><button type="button" id="toggle" aria-expanded="true">Skjul filtre</button></div>
    <label>Mærke <select name="brand"><option value="">Alle</option></select></label>
    <label>Model <select name="model" disabled><option value="">Alle</option></select></label>
    <div class="pair">
      <label>Årgang fra <input name="yearFrom" inputmode="numeric" placeholder="fx 2018"></label>
      <label>Årgang til <input name="yearTo" inputmode="numeric"></label>
    </div>
    <div class="pair">
      <label>Km fra <input name="kmFrom" inputmode="numeric"></label>
      <label>Km til <input name="kmTo" inputmode="numeric" placeholder="fx 100.000"></label>
    </div>
    <div class="pair">
      <label>Pris fra (kr.) <input name="priceFrom" inputmode="numeric"></label>
      <label>Pris til (kr.) <input name="priceTo" inputmode="numeric"></label>
    </div>
    <fieldset><legend>Drivmiddel</legend><div class="chips" id="fuels"></div></fieldset>
    <label>Min. rækkevidde (km) <input name="rangeFrom" inputmode="numeric" placeholder="elbiler, fx 400"></label>
    <fieldset><legend>Gearkasse</legend><div class="chips" id="gears"></div></fieldset>
    <div><button type="reset">Nulstil</button></div>
  </form>
  <main>
    <p class="summary" id="summary" aria-live="polite">Henter biler…</p>
    <div id="results"></div>
    <button class="more" id="more" hidden>Vis flere modeller</button>
  </main>
</div>
<footer id="footer">Ikke tilknyttet Bilbasen. Tryk på en model for at se annoncerne på bilbasen.dk.</footer>
<script type="module" src="app.mjs"></script>
</body>
</html>
